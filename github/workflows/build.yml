name: Build Xit FF

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Extraer proyecto Xit FF
        run: |
          rm -rf build_project
          mkdir build_project
          unzip -q Xit_FF_Shizuku.zip -d build_project

          echo "Contenido extraído:"
          find build_project -maxdepth 3 -type f | head -100

      - name: Encontrar proyecto Android
        run: |
          PROJECT_DIR=$(dirname "$(find build_project -name settings.gradle.kts -o -name settings.gradle | head -1)")

          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            echo "ERROR: No se encontró settings.gradle.kts ni settings.gradle dentro del ZIP."
            exit 1
          fi

          echo "Proyecto encontrado en: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Subir APK como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Xit-FF-APK
          path: "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk"
