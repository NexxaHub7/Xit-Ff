name: Build Xit FF

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Extraer Xit FF
        run: |
          rm -rf build_project
          mkdir build_project
          unzip -q Xit_FF_Shizuku.zip -d build_project

      - name: Encontrar proyecto
        run: |
          PROJECT_DIR=$(dirname "$(find build_project -name settings.gradle.kts -o -name settings.gradle | head -1)")

          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            echo "No se encontró el proyecto Android dentro del ZIP."
            exit 1
          fi

          echo "Proyecto encontrado: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Instalar SDK requerido
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Xit-FF-APK
          path: "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk"
